name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Foundry (solidity toolchain for the contract check)
        uses: foundry-rs/foundry-toolchain@v1
      - name: Lint
        run: npm run lint
      - name: Catalog check
        run: node scripts/catalog.js --check
      - name: Fork contracts match their sources
        run: npm run check:contracts
      - name: Address book is current
        run: npm run check:address-book
      - name: Foundry protocol tests compile (fork tests skip without RPC)
        run: npm run test:contracts
      - name: Showcase data check
        run: node scripts/showcaseCheck.js
      - name: Live DefiLlama smoke (informational)
        run: node src/simulation/api/smokeL2Overview.js
        continue-on-error: true

  # Optional. Never blocks CI: no secret means a clean skip, and a fork failure on a
  # public or rate-limited RPC is reported without failing the workflow.
  fork-suite:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Check for RPC secrets
        id: rpc
        env:
          ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          OPTIMISM_RPC_URL: ${{ secrets.OPTIMISM_RPC_URL }}
          ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL }}
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
          AVALANCHE_RPC_URL: ${{ secrets.AVALANCHE_RPC_URL }}
        run: |
          present=""
          for name in ETHEREUM_RPC_URL BASE_RPC_URL OPTIMISM_RPC_URL ARBITRUM_RPC_URL BSC_RPC_URL AVALANCHE_RPC_URL; do
            if [ -n "${!name}" ]; then present="$present $name"; fi
          done
          if [ -z "$present" ]; then
            msg="SKIPPED: no RPC URL configured for CI, so no fork test ran. This job is not a fork-test pass."
            echo "::warning title=fork-suite skipped::$msg"
            { echo "## Fork suite"; echo ""; echo "**$msg**"; } >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "RPC secrets present:$present"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci --no-audit --no-fund
        if: steps.rpc.outputs.run == 'true'
      - uses: foundry-rs/foundry-toolchain@v1
        if: steps.rpc.outputs.run == 'true'
      - name: Fork suite
        if: steps.rpc.outputs.run == 'true'
        env:
          ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          OPTIMISM_RPC_URL: ${{ secrets.OPTIMISM_RPC_URL }}
          ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL }}
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
          AVALANCHE_RPC_URL: ${{ secrets.AVALANCHE_RPC_URL }}
          FORK_TEST_TIMEOUT_MS: "180000"
        run: npm run fork:all

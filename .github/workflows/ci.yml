name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Catalog check
        run: node scripts/catalog.js --check
      - name: Live DefiLlama smoke (informational)
        run: node src/simulation/api/smokeL2Overview.js
        continue-on-error: true

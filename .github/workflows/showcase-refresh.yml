name: Showcase refresh

# Rebuilds showcase/data.json from DefiLlama and commits it to the same
# branch if it changed: automatically on a feature branch that changes the
# ranking code, and on demand for any branch. X mentions come from the
# committed data/x-mentions.json (recount them locally with X_MENTIONS_DIR).
# The bot commit uses GITHUB_TOKEN, so it does not retrigger workflows.

on:
  push:
    branches-ignore: [main]
    paths:
      - "src/analytics/ranking/**"
      - "data/x-mentions.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: showcase-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node src/analytics/ranking/top200Trending.js
      - run: node scripts/showcaseCheck.js
      - name: Commit showcase/data.json
        run: |
          if git diff --quiet -- showcase/data.json; then
            echo "showcase/data.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add showcase/data.json
          git commit -m "Refresh showcase/data.json"
          git push
